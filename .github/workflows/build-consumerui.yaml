name: Build and Push Consumer UI

on:
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Get latest version
        id: file_reader
        run: |
          LAST_LINE=$(tail -n 1 consumerui/versions.txt | tr -d '\r')
          echo "latest_version=${LAST_LINE}" >> $GITHUB_ENV

      - name: Log in to GAR
        uses: docker/login-action@v3
        with:
          registry: us-central1-docker.pkg.dev
          username: _json_key
          password: ${{ secrets.GCP_SA_KEY }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./consumerui
          file: ./consumerui/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            us-central1-docker.pkg.dev/titanium-gadget-502516-g3/my-repo/consumerui:${{ env.latest_version }}
            us-central1-docker.pkg.dev/titanium-gadget-502516-g3/my-repo/consumerui:latest
