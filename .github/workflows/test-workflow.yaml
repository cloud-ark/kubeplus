name: Test Build and Push KubePlus containers

on:
  workflow_dispatch:

jobs:
  build-and-push-containers:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GAR
        uses: docker/login-action@v3
        with:
          registry: us-central1-docker.pkg.dev
          username: _json_key
          password: ${{ secrets.GCP_SA_KEY }} # secret name may need to be changed

#       Mutating webhook
      - name: Get latest version of mutating-webhook
        run: |
          LAST_LINE=$(tail -n 1 mutating-webhook/versions.txt | tr -d '\r')
          echo "mutating_webhook_version=${LAST_LINE}" >> $GITHUB_ENV
 

      - name: Compile Go binaries
        working-directory: ./mutating-webhook
        env:
          GO111MODULE: "on"
          CGO_ENABLED: "0"
          GOOS: linux
        run: |
          GOARCH=amd64 go build -a -installsuffix cgo -o crd-hook-amd64 .
          GOARCH=arm64 go build -a -installsuffix cgo -o crd-hook-arm64 .
 
      - name: Build and Push mutating-webhook
        uses: docker/build-push-action@v6
        with:
          context: ./mutating-webhook
          file: ./mutating-webhook/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: us-central1-docker.pkg.dev/titanium-gadget-502516-g3/my-repo/mutating-webhook:${{ env.mutating_webhook_version }}

#       platform operator
      - name: Get latest version of platform-operator
        run: |
          LAST_LINE=$(tail -n 1 platform-operator/versions.txt | tr -d '\r')
          echo "platform_operator_version=${LAST_LINE}" >> $GITHUB_ENV

      - name: Compile platform-operator binaries
        working-directory: ./platform-operator
        env:
          GO111MODULE: "on"
          CGO_ENABLED: "0"
          GOOS: linux
        run: |
          GOARCH=amd64 go build -a -installsuffix cgo -o platform-operator-amd64 .
          GOARCH=arm64 go build -a -installsuffix cgo -o platform-operator-arm64 .
            
      - name: Build and Push platform-operator
        uses: docker/build-push-action@v6
        with:
          context: ./platform-operator
          file: ./platform-operator/artifacts/deployment/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: us-central1-docker.pkg.dev/titanium-gadget-502516-g3/my-repo/platform-operator:${{ env.platform_operator_version }}


      - name: Get latest version of consumerui
        run: |
          LAST_LINE=$(tail -n 1 consumerui/versions.txt | tr -d '\r')
          echo "consumerui_version=${LAST_LINE}" >> $GITHUB_ENV

      - name: Build and Push consumerui
        uses: docker/build-push-action@v6
        with:
          context: ./consumerui
          file: ./consumerui/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: us-central1-docker.pkg.dev/titanium-gadget-502516-g3/my-repo/consumerui:${{ env.consumerui_version }}

            
            
      - name: Get latest version of webhook-tls-getter
        run: |
          LAST_LINE=$(tail -n 1 deploy/versions.txt | tr -d '\r')
          echo "webhook_tls_getter_version=${LAST_LINE}" >> $GITHUB_ENV
            
      - name: Build and Push webhook-tls-getter
        uses: docker/build-push-action@v6
        with:
          context: ./deploy
          file: ./deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: us-central1-docker.pkg.dev/titanium-gadget-502516-g3/my-repo/webhook-tls-getter:${{ env.webhook_tls_getter_version }}

            




