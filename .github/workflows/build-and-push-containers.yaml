name: Build and Push KubePlus containers

on:
  workflow_dispatch:

jobs:
  build-and-push-containers:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GCR
        uses: docker/login-action@v3
        with:
          registry: gcr.io
          username: _json_key
          password: ${{ secrets.GCP_SA_KEY }} # secret name may need to be changed

#     delete kubeplus resources
      - name: get latest version of delete kubeplus resources
        run: |
          LAST_LINE=$(tail -n 1 deploy/versions.txt | tr -d '\r')
          echo "cleanup_version=${LAST_LINE}" >> $GITHUB_ENV
      
      - name: Build and Push cleanup
        uses: docker/build-push-action@v6
        with:
          context: ./deploy
          file: ./deploy/Dockerfile.cleanup
          platforms: linux/amd64,linux/arm64
          push: true
          tags: gcr.io/cloudark-kubeplus/kubeplus/delete-kubeplus-resources:${{ env.cleanup_version }}

#     helm pod
      - name: get latest version of helm-pod
        run: |
          LAST_LINE=$(tail -n 1 platform-operator/helm-pod/versions.txt | tr -d '\r')
          echo "helm_pod_version=${LAST_LINE}" >> $GITHUB_ENV

      - name: Compile GO binaries (helm-pod)
        working-directory: ./platform-operator/helm-pod
        env:
          GO111MODULE: "on"
          CGO_ENABLED: "0"
          GOOS: linux
          GOFLAGS: "-mod=mod"
        run: |
          GOARCH=amd64 go build -a -installsuffix cgo -o helm-pod-amd64 .
          GOARCH=arm64 go build -a -installsuffix cgo -o helm-pod-arm64 .

      - name: Build and Push helm-pod
        uses: docker/build-push-action@v6
        with:
          context: ./platform-operator/helm-pod
          file: ./platform-operator/helm-pod/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: gcr.io/cloudark-kubeplus/kubeplus/helm-pod:${{ env.helm_pod_version }}

#     Mutating webhook
      - name: Get latest version of mutating-webhook
        run: |
          LAST_LINE=$(tail -n 1 mutating-webhook/versions.txt | tr -d '\r')
          echo "mutating_webhook_version=${LAST_LINE}" >> $GITHUB_ENV
 

      - name: Compile Go binaries (mutating-webhook)
        working-directory: ./mutating-webhook
        env:
          GO111MODULE: "on"
          CGO_ENABLED: "0"
          GOOS: linux
          GOFLAGS: "-mod=mod"
        run: |
          GOARCH=amd64 go build -a -installsuffix cgo -o crd-hook-amd64 .
          GOARCH=arm64 go build -a -installsuffix cgo -o crd-hook-arm64 .
 
      - name: Build and Push mutating-webhook
        uses: docker/build-push-action@v6
        with:
          context: ./mutating-webhook
          file: ./mutating-webhook/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: gcr.io/cloudark-kubeplus/kubeplus/mutating-webhook:${{ env.mutating_webhook_version }}

#     platform operator
      - name: Get latest version of platform-operator
        run: |
          LAST_LINE=$(tail -n 1 platform-operator/versions.txt | tr -d '\r')
          echo "platform_operator_version=${LAST_LINE}" >> $GITHUB_ENV

      - name: Compile platform-operator binaries
        working-directory: ./platform-operator
        env:
          GO111MODULE: "on"
          CGO_ENABLED: "0"
          GOOS: linux
          GOFLAGS: "-mod=mod"
        run: |
          GOARCH=amd64 go build -a -installsuffix cgo -o platform-operator-amd64 .
          GOARCH=arm64 go build -a -installsuffix cgo -o platform-operator-arm64 .
            
      - name: Build and Push platform-operator
        uses: docker/build-push-action@v6
        with:
          context: ./platform-operator
          file: ./platform-operator/artifacts/deployment/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: gcr.io/cloudark-kubeplus/kubeplus/platform-operator:${{ env.platform_operator_version }}

#     consumerui
      - name: Get latest version of consumerui
        run: |
          LAST_LINE=$(tail -n 1 consumerui/versions.txt | tr -d '\r')
          echo "consumerui_version=${LAST_LINE}" >> $GITHUB_ENV

      - name: Build and Push consumerui
        uses: docker/build-push-action@v6
        with:
          context: ./consumerui
          file: ./consumerui/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: gcr.io/cloudark-kubeplus/kubeplus/consumerui:${{ env.consumerui_version }}
            
#     webhook tls getter
      - name: Get latest version of webhook-tls-getter
        run: |
          LAST_LINE=$(tail -n 1 deploy/versions.txt | tr -d '\r')
          echo "webhook_tls_getter_version=${LAST_LINE}" >> $GITHUB_ENV
            
      - name: Build and Push webhook-tls-getter
        uses: docker/build-push-action@v6
        with:
          context: ./deploy
          file: ./deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: gcr.io/cloudark-kubeplus/kubeplus/webhook-tls-getter:${{ env.webhook_tls_getter_version }}

            




